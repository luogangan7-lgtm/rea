name: Sync REA upstream

on:
  schedule:
    # Daily at 08:17 Asia/Shanghai (00:17 UTC).
    - cron: '17 0 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/sync-upstream.yml]

permissions: {}

concurrency:
  group: sync-rea-upstream-main
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'luogangan7-lgtm/rea' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Merge upstream without overwriting fork commits
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const repository = 'luogangan7-lgtm/rea';
          const upstream = 'morluto/rea';
          const branch = 'main';
          const summary = (message) => {
            console.log(message);
            if (process.env.GITHUB_STEP_SUMMARY) {
              fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, message + '\n');
            }
          };
          async function api(path, method = 'GET', body) {
            const response = await fetch('https://api.github.com' + path, {
              method,
              headers: {
                Accept: 'application/vnd.github+json',
                Authorization: 'Bearer ' + process.env.GH_TOKEN,
                'X-GitHub-Api-Version': '2022-11-28',
                'Content-Type': 'application/json',
              },
              body: body === undefined ? undefined : JSON.stringify(body),
              signal: AbortSignal.timeout(60000),
            });
            if (!response.ok) {
              if (method === 'POST' && response.status === 409) {
                throw new Error('Merge conflict: upstream sync stopped. Resolve the conflict manually; this workflow never force-pushes.');
              }
              throw new Error('GitHub API returned HTTP ' + response.status + '. Check the workflow permissions and repository state.');
            }
            return response.json();
          }
          (async () => {
            if (process.env.GITHUB_REPOSITORY !== repository || process.env.GITHUB_REF !== 'refs/heads/' + branch) {
              throw new Error('Repository or branch guard failed; no sync attempted.');
            }
            if (!process.env.GH_TOKEN) throw new Error('Missing built-in GitHub token; no sync attempted.');
            const repo = await api('/repos/' + repository);
            if (repo.full_name !== repository || repo.fork !== true || repo.default_branch !== branch ||
                repo.parent?.full_name !== upstream || repo.parent?.default_branch !== branch) {
              throw new Error('Fork, parent, or default branch changed; no sync attempted.');
            }
            const result = await api('/repos/' + repository + '/merge-upstream', 'POST', { branch });
            summary('Successfully synchronized ' + upstream + ':' + branch + ' into ' + repository + ':' + branch + '.');
            if (typeof result.merge_type === 'string') summary('Sync result: ' + result.merge_type + '.');
            summary('Existing fork commits are preserved. No force push, release, or deployment was requested by this workflow.');
          })().catch((error) => {
            summary('Upstream sync failed: ' + error.message);
            process.exitCode = 1;
          });
          NODE
